name: Refresh Packwiz Index

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install packwiz
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          go install github.com/packwiz/packwiz@main

      - name: Verificar instalação
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          which packwiz
          packwiz --version

      - name: Refresh packwiz index
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          pwd
          ls -la
          packwiz refresh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-refresh packwiz index"
          git push
